name: Deploy website preview

on:
  push:
    branches: [main]
    paths: ['05_website/site/**', '.github/workflows/deploy-preview.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05_website/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 05_website/site/package-lock.json
      - run: npm ci
      - run: npm run generate
        env:
          NUXT_APP_BASE_URL: /fresca-premier-fresh/
          NUXT_PUBLIC_SITE_URL: https://sharlmon.github.io/fresca-premier-fresh
          PREVIEW: '1'
      - run: touch .output/public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 05_website/site/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
